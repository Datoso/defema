<style>
:root{
  --bg:#fdfcf8; --surface:#ffffff; --fg:#1b2a1f; --muted:#6b6357; --line:#ece6db;
  --leaf:#163a22; --leaf-2:#1f4d2d; --seed:#fff1c9; --seed-ink:#5a3e1b; --soil:#7b5434; --soil-soft:#f6efe5;
  --sun-1:#fff4d4; --sun-2:#fffbf0; --on-hero:#163a22;
  --promo:#a5402d; --wa:#1d8a4d; --map-bg:#f3efe6; --map-road:#ffffff; --map-block:#e6dfd1;
  --warn-bg:#fff8e4; --warn-line:#ecd9a6; --photo:#ffffff;
  --display:"Zilla Slab", Georgia, serif; --body:"Figtree", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1611; --surface:#161f18; --fg:#e8ede4; --muted:#b0a796; --line:#2a332b;
  --leaf:#0f2618; --leaf-2:#7fbf8c; --seed:#3a3120; --seed-ink:#f3dfae; --soil:#d1a77f; --soil-soft:#221c16;
  --sun-1:#2a2617; --sun-2:#161f18; --on-hero:#e8ede4;
  --promo:#ff9a85; --wa:#2fa863; --map-bg:#1a221b; --map-road:#2e382f; --map-block:#232c24;
  --warn-bg:#231f12; --warn-line:#5a4a22; --photo:#f4f4f0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1611; --surface:#161f18; --fg:#e8ede4; --muted:#b0a796; --line:#2a332b;
  --leaf:#0f2618; --leaf-2:#7fbf8c; --seed:#3a3120; --seed-ink:#f3dfae; --soil:#d1a77f; --soil-soft:#221c16;
  --sun-1:#2a2617; --sun-2:#161f18; --on-hero:#e8ede4;
  --promo:#ff9a85; --wa:#2fa863; --map-bg:#1a221b; --map-road:#2e382f; --map-block:#232c24;
  --warn-bg:#231f12; --warn-line:#5a4a22; --photo:#f4f4f0; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
a{color:inherit}
img{max-width:100%}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
header{background:var(--leaf);color:#f2f6ee;position:sticky;top:0;z-index:20}
.top{display:flex;align-items:center;gap:20px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;flex:0 0 auto}
.logo{background:linear-gradient(140deg,#fffdf4 0%,#fff1c2 38%,#ffd978 78%,#f7c45a 100%);border-radius:12px;padding:4px 9px;display:grid;place-items:center;flex:0 0 auto;box-shadow:0 0 0 1.5px rgba(255,241,201,.85),0 6px 18px rgba(0,0,0,.28)}
.logo-svg{display:block;width:92px;height:auto}
.brand b{font-family:var(--display);font-size:1.75rem;line-height:1;display:block;letter-spacing:.02em}
.brand small{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
nav.main{display:flex;gap:4px;margin-left:auto}
nav.main a{padding:8px 12px;border-radius:6px;text-decoration:none;font-weight:600}
nav.main a:hover,nav.main a[aria-current="page"]{background:rgba(255,255,255,.12)}
nav.main a[aria-current="page"]{box-shadow:inset 0 -3px 0 #f7dc94}
.search{flex:1 1 220px;max-width:320px;display:flex}
.search input{width:100%;border:0;border-radius:6px;padding:9px 12px;font:inherit;background:#fff;color:#1f2a1c}
.search input:focus{outline:3px solid var(--seed)}

/* Corpo */
.layout{display:grid;grid-template-columns:240px 1fr;gap:28px;padding-block:24px 80px;align-items:start}
aside{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
aside h2{font-family:var(--display);font-size:1rem;margin:8px 10px 6px;color:var(--soil);text-transform:uppercase;letter-spacing:.08em}
details{border-top:1px solid var(--line)}
details:first-of-type{border-top:0}
summary{list-style:none;cursor:pointer;padding:10px;font-weight:700;display:flex;justify-content:space-between;align-items:center;border-radius:6px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-weight:400;color:var(--muted)}
details[open] summary::after{content:"–"}
summary:hover{background:var(--soil-soft)}
.subs{display:flex;flex-direction:column;padding:0 0 8px 10px}
.subs button{all:unset;cursor:pointer;padding:6px 10px;border-radius:6px;color:var(--muted);font-size:.93rem}
.subs button:hover,.subs button.on{color:var(--fg);background:var(--soil-soft)}
.subs button.on{font-weight:700;box-shadow:inset 3px 0 0 var(--leaf-2)}
.subs button:focus-visible,summary:focus-visible{outline:2px solid var(--leaf-2)}
.btn.dep-toggle{display:none}

main{min-width:0}
.hero{background:linear-gradient(180deg,var(--sun-1) 0%,var(--sun-2) 75%);color:var(--on-hero);border:1px solid var(--line);border-radius:12px;padding:28px;display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:center;overflow:hidden}
.hero h1{font-family:var(--display);font-size:clamp(1.6rem,3.4vw,2.4rem);line-height:1.1;margin:0 0 8px;text-wrap:balance}
.hero p{margin:0 0 16px;max-width:46ch;color:var(--muted)}
.tag{display:inline-block;background:var(--surface);border:1px solid var(--warn-line);color:var(--soil);font-weight:700;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:4px;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
.btn-seed{background:var(--leaf);color:#fff}
.btn-wa{background:var(--wa);color:#fff;width:100%;justify-content:center;text-align:center}
.acoes{margin-top:2px}
.btn:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.hero svg{width:100%;max-width:260px;justify-self:end}

/* Atalhos de departamento */
.shortcuts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.shortcut{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;grid-template-columns:32px 1fr;column-gap:10px;align-items:center}
.shortcut .ic{grid-row:span 2}
#view > section.block:first-child{margin-top:0}
.shortcut:hover{border-color:var(--leaf-2)}
.shortcut:focus-visible{outline:2px solid var(--leaf-2)}
.shortcut .ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.shortcut .ic svg{width:20px;height:20px}
.shortcut b{font-size:.9rem;line-height:1.2}
.shortcut span:not(.ic){font-size:.74rem;color:var(--muted);line-height:1.25}

section.block{margin-top:36px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sec-head h2{font-family:var(--display);font-size:1.5rem;margin:0;color:var(--leaf-2)}
.sec-head h2::after{content:"";display:block;width:36px;height:2px;background:var(--soil);opacity:.55;margin-top:6px;border-radius:2px}
.link{color:var(--leaf-2);font-weight:600;cursor:pointer;background:none;border:0;font:inherit;padding:0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.thumb{aspect-ratio:1/1;display:grid;place-items:center;position:relative;border:0;padding:0;width:100%;cursor:zoom-in;font:inherit}
.thumb:focus-visible,.ver-tit:focus-visible{outline:3px solid var(--leaf-2);outline-offset:-3px}
.ver-tit{all:unset;cursor:pointer;color:inherit}
.ver-tit:hover{color:var(--leaf-2);text-decoration:underline;text-underline-offset:3px}
.btn-add{background:var(--leaf);color:#fff;width:100%;justify-content:center;text-align:center}
.btn-add:hover{background:var(--leaf-2)}
.qtd{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;border:1.5px solid var(--leaf-2);border-radius:8px;overflow:hidden;background:var(--surface)}
.qtd button{all:unset;cursor:pointer;height:40px;display:grid;place-items:center;font-size:1.3rem;font-weight:700;color:var(--leaf-2);background:var(--soil-soft)}
.qtd button:focus-visible{outline:2px solid var(--leaf-2);outline-offset:-2px}
.qtd span{text-align:center;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums;line-height:1.1}
.qtd span small{display:block;font-weight:600;font-size:.7rem;color:var(--muted)}
.opcoes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.opcoes button{all:unset;cursor:pointer;font-size:.8rem;font-weight:600;padding:5px 9px;border-radius:999px;border:1.5px solid var(--line);color:var(--fg);background:var(--surface);white-space:nowrap}
.opcoes button:hover{border-color:var(--leaf-2)}
.opcoes button.on{border-color:var(--leaf-2);background:var(--leaf-2);color:#fff}
.opcoes button i{font-style:normal;background:#fff1c9;color:#5a3e1b;border-radius:999px;padding:0 6px;margin-left:2px;font-size:.72rem}
.opcoes button:focus-visible{outline:2px solid var(--leaf-2);outline-offset:2px}
.op-sel{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:.82rem;font-weight:600;color:var(--muted)}
.op-sel select{flex:1;min-width:0;font:inherit;font-weight:700;color:var(--fg);padding:7px 8px;border:1.5px solid var(--leaf-2);border-radius:8px;background:var(--surface)}
.op-ped{display:block;font-size:.75rem;color:var(--soil);margin:-4px 0 8px}
.pedido-bar{position:fixed;left:0;right:0;bottom:0;z-index:35;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.06))}
.pedido-bar button{all:unset;box-sizing:border-box;cursor:pointer;max-width:560px;margin:0 auto;width:100%;display:flex;align-items:center;gap:10px;background:var(--leaf);color:#fff;border-radius:12px;padding:13px 16px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.pedido-bar button:focus-visible{outline:3px solid #f7dc94}
.pedido-bar .ver-ped{margin-left:auto;font-weight:700;color:#fff1c9;white-space:nowrap}
body.tem-pedido .wa-float{display:none}
body.tem-pedido footer{padding-bottom:96px}
dialog{border:0;border-radius:14px;padding:0;max-width:min(860px,calc(100vw - 24px));width:100%;max-height:calc(100dvh - 24px);background:var(--surface);color:var(--fg);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(15,25,18,.55)}
.fechar{position:absolute;top:10px;right:10px;z-index:2;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:1rem;cursor:pointer}
.det{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:0}
.det-media{position:relative;display:grid;place-items:center;aspect-ratio:1/1}
.det-media.has-photo{background:var(--photo)!important}
.det-media img{width:100%;height:100%;object-fit:contain;padding:24px}
.det-media svg{width:45%}
.det-media svg.ilu{width:88%}
.det-info{padding:28px 24px 24px;display:flex;flex-direction:column;gap:8px;min-width:0}
.det-info h2{font-family:var(--display);font-size:1.6rem;line-height:1.15;margin:0;color:var(--leaf-2);padding-right:36px}
.det-info p{margin:4px 0;max-width:52ch}
.det-info .price strong{font-size:1.5rem}
.det-info .acoes{margin-top:8px}
.det-info .price{margin-top:6px;padding-top:0}
.obs{font-size:.85rem;color:var(--muted);margin:0}
.so-este{font-size:.88rem;margin-top:4px}
#dlgPedido{max-width:560px;padding:22px 20px 20px}
#dlgPedido h2{font-family:var(--display);color:var(--leaf-2);margin:0 0 4px;font-size:1.5rem}
.itens{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column}
.itens li{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mini{width:56px;height:56px;border-radius:8px;display:grid;place-items:center;overflow:hidden;position:relative}
.mini.has-photo{background:var(--photo)!important;border:1px solid var(--line)}
.mini img{width:100%;height:100%;object-fit:contain;padding:3px}
.mini svg{width:60%}.mini svg.ilu{width:100%}.mini .ilu-tag{display:none}
.itens .info{display:flex;flex-direction:column;min-width:0;font-size:.85rem;color:var(--muted)}
.itens .info b{color:var(--fg);font-size:.95rem}
.itens .vl{color:var(--leaf-2);font-weight:700}
.mini-q{grid-template-columns:34px 30px 34px}
.mini-q button{height:34px;font-size:1.1rem}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--line);padding-top:12px;margin-top:4px}
.total strong{font-size:1.35rem;color:var(--leaf-2);font-variant-numeric:tabular-nums}
.campo{display:flex;flex-direction:column;gap:4px;margin:14px 0 12px;font-weight:600;font-size:.9rem}
.campo input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.btn.grande{padding:14px 16px;font-size:1.02rem}
.limpar{display:block;margin:12px auto 0;font-size:.88rem;color:var(--muted)}
.vazio{color:var(--muted);padding:20px 0}
@media (max-width:640px){
  .det{grid-template-columns:minmax(0,1fr)}
  .det-media{aspect-ratio:4/3}
  dialog{max-width:100vw;width:100vw;max-height:92dvh;margin:auto 0 0;border-radius:16px 16px 0 0}
  #dlgPedido{max-width:100vw}
}
.thumb svg{width:40%;height:auto}
.thumb.has-photo{background:var(--photo)!important}
.thumb svg.ilu{width:86%}
.ilu-tag{position:absolute;right:8px;top:8px;font-size:.66rem;font-weight:600;color:#7b5434;background:#fff;border:1px solid #ecd9a6;border-radius:999px;padding:1px 8px}
.thumb img{width:100%;height:100%;object-fit:contain;padding:10px;display:block}
.badge{position:absolute;top:10px;left:10px;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;z-index:1}
.b-promo{background:var(--promo);color:#fff}
.b-novo{background:var(--seed);color:var(--seed-ink);border:1px solid var(--warn-line)}
.b-consulta{background:var(--soil);color:#fff}
.b-restrito{background:var(--leaf);color:#fff}
.restr{font-size:.8rem;color:var(--soil);background:var(--soil-soft);border-radius:6px;padding:6px 8px;line-height:1.35}
.card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1;border-top:1px solid var(--line)}
.cat{font-size:.72rem;color:var(--soil);text-transform:uppercase;letter-spacing:.08em}
.card h3{font-size:1rem;margin:0;line-height:1.3}
.unit{font-size:.85rem;color:var(--muted)}
.price{margin-top:auto;padding-top:6px;font-variant-numeric:tabular-nums}
.price s{color:var(--muted);font-size:.85rem;margin-right:6px}
.price strong{font-size:1.2rem;color:var(--leaf-2)}
.price .ask{font-weight:700;color:var(--soil)}
.empty{padding:40px;text-align:center;color:var(--muted);background:var(--surface);border-radius:10px;border:1px dashed var(--line)}
.crumb{color:var(--muted);font-size:.9rem;margin-bottom:6px}
.notice{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:.93rem}
.notice b{display:block;margin-bottom:2px}

/* Sobre */
.about{display:grid;grid-template-columns:1.1fr 1fr;gap:24px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;min-width:0}
.panel h2{font-family:var(--display);margin:0 0 10px;font-size:1.4rem}
.panel p{max-width:62ch}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
dt{color:var(--muted);font-weight:600}
dd{margin:0;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.map{border-radius:10px;overflow:hidden;border:1px solid var(--line);margin-top:14px;background:var(--map-bg)}
.map svg{display:block;width:100%;height:auto}
.map-foot{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--surface);flex-wrap:wrap;font-size:.92rem}

.wa-float{transition:opacity .2s,transform .2s;position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--wa);color:#fff;border-radius:999px;padding:12px 18px 12px 14px;display:flex;gap:8px;align-items:center;font-weight:700;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:30}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:.88rem;padding-block:20px 28px}
.wa-float.oculto{opacity:0;transform:translateY(20px);pointer-events:none}
.proto{background:var(--seed);color:var(--seed-ink);border-bottom:1px solid var(--warn-line);font-size:.82rem;text-align:center;padding-block:6px;font-weight:600}

@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  aside{position:static;display:none}
  aside.open{display:block}
  .shortcuts{display:none}
  body.pg-inicio .shortcuts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:12px}
  .btn.dep-toggle{display:flex;width:100%;justify-content:center;background:var(--surface);color:var(--fg);border:1px solid var(--line)}
  .hero{grid-template-columns:1fr}
  .hero svg{display:none}
  .about{grid-template-columns:1fr}
  nav.main{margin-left:0;order:3;width:100%}
  .search{order:4;max-width:none}
}
@media (max-width:480px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card-body{padding:10px}
  .price strong{font-size:1.05rem}
  .price s{display:block;margin:0}
  .btn-wa{padding:9px 8px;font-size:.88rem}
  .shortcuts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wa-float span{display:none} .wa-float{padding:14px}
  nav.main a{padding:8px 8px}
}

/* ===== Celular: lista compacta para ver mais itens na tela ===== */
@media (max-width:600px){
  body{font-size:14px}
  .proto{font-size:.72rem;padding-block:3px}
  .top{gap:8px 10px;padding-block:8px}
  .logo{padding:2px 5px;border-radius:8px}
  .logo-svg{width:64px}
  nav.main{order:2;width:auto;margin-left:auto;gap:0}
  nav.main a{padding:6px 7px;font-size:.84rem}
  .search{order:3;flex-basis:100%}
  .search input{padding:8px 10px}
  .layout{gap:12px;padding-block:12px 70px}
  .btn.dep-toggle{padding:8px 12px;font-size:.88rem}
  body.pg-inicio .shortcuts{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
  .shortcut{grid-template-columns:1fr;justify-items:center;text-align:center;padding:8px 4px;row-gap:4px}
  .shortcut .ic{grid-row:auto;width:28px;height:28px}
  .shortcut .ic svg{width:17px;height:17px}
  .shortcut b{font-size:.68rem;line-height:1.15}
  .shortcut span:not(.ic){display:none}
  section.block{margin-top:20px}
  .sec-head{margin-bottom:8px}
  .sec-head h2{font-size:1.2rem}
  .sec-head h2::after{margin-top:4px}
  .grid{grid-template-columns:1fr;gap:8px}
  .card{display:grid;grid-template-columns:84px minmax(0,1fr);align-items:start}
  .thumb{width:84px;height:84px;aspect-ratio:auto;margin:10px 0 10px 10px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
  .thumb img{padding:4px}
  .thumb svg{width:46%}
  .thumb svg.ilu{width:100%}
  .ilu-tag{display:none}
  .badge{top:3px;left:3px;font-size:.55rem;padding:2px 4px;letter-spacing:.02em}
  .card-body{border-top:0;padding:9px 10px 10px;gap:2px}
  .cat{font-size:.62rem}
  .card h3{font-size:.92rem;line-height:1.25}
  .unit{font-size:.76rem}
  .restr{font-size:.72rem;padding:4px 6px}
  .price{padding-top:2px}
  .price strong{font-size:1rem}
  .price s{display:inline;font-size:.75rem;margin-right:6px}
  .acoes{margin-top:6px}
  .btn-add,.acoes .btn-wa{padding:7px 12px;font-size:.8rem;border-radius:7px;width:auto}
  .acoes .qtd{max-width:200px}
  .qtd{grid-template-columns:34px 1fr 34px}
  .qtd button{height:32px;font-size:1.1rem}
  .opcoes{gap:4px;margin-bottom:6px}
  .opcoes button{padding:3px 7px;font-size:.72rem}
  .op-sel{font-size:.74rem;margin-bottom:6px}
  .op-sel select{padding:5px 6px}
  .notice{font-size:.8rem;padding:10px 12px}
  .crumb{font-size:.78rem}
  .pedido-bar button{padding:10px 14px}
}

/* ===== Céu de amanhecer ao fundo ===== */
body{background:var(--bg)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(circle at 82% 0%, var(--sol-1) 0, var(--sol-2) 16%, transparent 42%),
    linear-gradient(180deg, var(--ceu-1) 0%, var(--ceu-2) 28%, var(--ceu-3) 62%, var(--bg) 100%);}
:root{--ceu-1:#ffeeb8;--ceu-2:#fff5d6;--ceu-3:#fdfbf2;--sol-1:rgba(255,206,84,.55);--sol-2:rgba(255,224,140,.28)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ceu-1:#1d2a1f;--ceu-2:#16201a;--ceu-3:#121a14;--sol-1:rgba(255,196,84,.18);--sol-2:rgba(255,196,84,.06)}
  :root:not([data-theme="light"]) body::before{opacity:.9}}
:root[data-theme="dark"]{--ceu-1:#1d2a1f;--ceu-2:#16201a;--ceu-3:#121a14;--sol-1:rgba(255,196,84,.18);--sol-2:rgba(255,196,84,.06)}
/* ===== Busca com lupa ===== */
.search{position:relative;align-items:center}
.search .lupa{position:absolute;left:11px;width:17px;height:17px;color:#6d7a66;pointer-events:none}
.search input{padding-left:36px}
/* ===== Ícones dos atalhos ===== */
.shortcut .ic{box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.shortcut .ic svg{width:22px;height:22px}
.shortcut.on{border-color:var(--leaf-2);box-shadow:inset 3px 0 0 var(--leaf-2)}
.dep-toggle svg{width:18px;height:18px;flex:0 0 auto}
.dep-toggle .seta{transition:transform .2s;margin-left:auto}
.dep-toggle[aria-expanded="true"] .seta{transform:rotate(180deg)}

/* ===== Celular: atalhos em coluna à esquerda + barra de departamentos fina e fixa ===== */
@media (max-width:860px){
  .layout{grid-template-columns:72px minmax(0,1fr);gap:10px 10px;align-items:start}
  .layout > div:first-child{display:contents}
  .btn.dep-toggle{grid-column:1/-1;position:sticky;top:var(--hdr,0px);z-index:15;padding:6px 12px;font-size:.84rem;min-height:0;
    justify-content:flex-start;gap:8px;border-radius:999px;background:color-mix(in srgb,var(--surface) 88%,transparent);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(30,50,30,.08)}
  aside{grid-column:1/-1}
  aside.open{position:fixed;z-index:16;top:calc(var(--hdr,0px) + 46px);left:12px;right:12px;max-height:calc(100dvh - var(--hdr,0px) - 64px);
    overflow:auto;box-shadow:0 14px 40px rgba(0,0,0,.25);overscroll-behavior:contain}
  .shortcuts, body.pg-inicio .shortcuts{display:flex;flex-direction:column;gap:6px;margin:0;grid-column:1;
    position:sticky;top:calc(var(--hdr,0px) + 46px);align-self:start}
  main{grid-column:2}
  body.pg-sobre .shortcuts{display:none}
  body.pg-sobre main{grid-column:1/-1}
  .shortcut{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:8px 3px;border-radius:12px}
  .shortcut .ic{width:38px;height:38px;border-radius:11px}
  .shortcut .ic svg{width:23px;height:23px}
  .shortcut b{font-size:.64rem;line-height:1.15;font-weight:700}
  .shortcut span:not(.ic){display:none}
  .shortcut.on{box-shadow:inset 0 -3px 0 var(--leaf-2)}
}
@media (max-width:600px){
  .search .lupa{left:10px;width:16px;height:16px}
  .search input{padding-left:33px}
  .card{grid-template-columns:76px minmax(0,1fr)}
  .thumb{width:66px;height:66px}
  .thumb .badge,.thumb [class^="b-"]{font-size:.55rem;padding:2px 4px}
  .thumb .b-consulta{display:none}
}

   Use no produto: ilu:["saco","TERRA VEGETAL","#5a3d26"] · ["bandeja","alface"] · ["vaso","cafe"] · ["ancinho"] */
const ILU = (()=>{
  const G1="#2f6b3c", G2="#5d9a5f", G3="#9cc98a", BR="#6b4a2f", BR2="#8a6343";
  const wrap = inner => `<svg class="ilu" viewBox="0 0 200 200" aria-hidden="true">

  function saco(rotulo, cor, corMaterial){
    const linhas = rotulo.split("|");
    return wrap(`
      <ellipse cx="100" cy="176" rx="66" ry="8" fill="#000" opacity=".08"/>
      <path d="M52 52 Q50 44 58 42 L142 42 Q150 44 148 52 L156 162 Q156 172 146 172 L54 172 Q44 172 44 162 Z" fill="#efe6d4" stroke="#d6c7aa" stroke-width="2"/>

      ${linhas.map((t,i)=>`<text x="100" y="${110+i*13-(linhas.length-1)*6}" text-anchor="middle" font-family="Figtree,system-ui,sans-serif" font-weight="800" font-size="${t.length>9?10:12}" fill="#1b2a1f">${t}</text>`).join("")}

      case "cebolinha": return `<g transform="translate(${x} ${y})" stroke="${G2}" stroke-width="2.4" stroke-linecap="round"><path d="M-3 0V-20M0 0V-24M3 0V-19"/></g>`;

  }
  function bandeja(tipo, celulas){
    const cols=6, rows=3, w=26, x0=22, y0=104;
    let plantas="", furos="";
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){

      ${folhaPar(84,.95,"#1f5a32")}${folhaPar(66,.8,"#2f6b3c")}${folhaPar(50,.55,"#3d7d4a")}
      ${regua(92,180,"15 cm")}`);
    if(tipo==="maracuja") return wrap(`
      <ellipse cx="96" cy="180" rx="50" ry="6" fill="#000" opacity=".1"/>
      <path d="M52 112 L140 112 L134 176 L58 176 Z" fill="#26292b"/>
      <path d="M52 112 L140 112 L139 122 L53 122 Z" fill="#3a3e41"/>
      <ellipse cx="96" cy="113" rx="43" ry="5" fill="#4a3321"/>
      <path d="M118 113 V28" stroke="${BR2}" stroke-width="4" stroke-linecap="round"/>
      <path d="M96 113 C92 96 114 92 116 80 C118 66 100 62 104 50 C108 40 118 40 118 34" stroke="${G1}" stroke-width="2.4" fill="none"/>
      ${[[102,100,-30],[114,82,20],[104,62,-20],[112,44,25]].map(([x,y,r])=>`<path d="M${x} ${y} l-14 -4 l6 -6 l-10 -8 l14 2 l2 -10 l6 10 l10 -4 l-4 12z" fill="${G2}" transform="rotate(${r} ${x} ${y})"/>`).join("")}
      <path d="M124 58 c8 -2 10 6 4 8 M90 74 c-7 -2 -9 5 -3 7" stroke="${G2}" fill="none" stroke-width="1.4"/>
      ${regua(112,176,"30 cm",150)}
      <path d="M52 186 H140 M52 181 V191 M140 181 V191" stroke="#b9a98d" stroke-width="1.5"/>
      <text x="96" y="199" text-anchor="middle" font-family="Figtree,system-ui,sans-serif" font-weight="700" font-size="11" fill="#7b5434">25 cm</text>`);
    /* pimentas: muda pequena, igual às de bandeja */
    const longa = tipo==="dedo";

      <ellipse cx="100" cy="166" rx="34" ry="5" fill="#000" opacity=".1"/>

      <ellipse cx="114" cy="${longa?102:106}" rx="15" ry="6.5" fill="${G2}" transform="rotate(28 114 ${longa?102:106})"/>
      <ellipse cx="93" cy="${longa?86:92}" rx="9" ry="4.5" fill="${G2}" transform="rotate(-40 93 ${longa?86:92})"/>

function descricao(p){
  if(p.descricao) return p.descricao;   // texto cadastrado no painel tem prioridade
  if(DESC_MARCA[p.nome+"|"+p.marca]) return DESC_MARCA[p.nome+"|"+p.marca];
  if(DESC[p.nome]) return DESC[p.nome];
  if(NPK[p.nome]) return `Adubo mineral NPK. Os números são as porcentagens de nitrogênio (N), fósforo (P) e potássio (K). ${NPK[p.nome]}`;
  if(/^Sementes de/.test(p.sub) || p.dep==="Sementes") return "Semente de hortaliça Isla em envelope. No verso do envelope você encontra a época de plantio da sua região, o espaçamento e o tempo até a colheita.";
  if(p.sub==="Bandeja 200 mudas"||p.sub==="Bandeja 128 mudas") return `Bandeja com ${p.sub.match(/\d+/)[0]} mudas prontas para transplante para o canteiro ou para o vaso. Retire na loja.`;
  if(p.nome.includes("pimenta")) return "Muda pequena, do tamanho das de bandeja, pronta para plantar em vaso ou canteiro.";
  if(p.nome==="Muda de café") return "Muda de café em tubete plástico de cerca de 15 cm, pronta para plantio.";
  if(p.nome==="Muda de maracujá azedo") return "Muda de maracujá azedo (para suco) em saquinho de 30 × 25 cm. Precisa de espaldeira ou cerca para subir.";
  if(p.dep==="Ferragens e EPIs") return p.sub==="EPIs" ? "Equipamento de proteção individual para o trabalho no campo e na aplicação de produtos. Consulte modelos e tamanhos disponíveis." : "Ferramenta de mão para o dia a dia no sítio e na obra. Consulte modelos disponíveis.";
  return "Consulte mais informações sobre este produto pelo WhatsApp.";
}

const brl = v => v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const waLink = msg => `https://wa.me/${LOJA.whatsapp}?text=${encodeURIComponent(msg)}`;
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const icon = dep => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[dep]}</svg>`;

function midia(p, grande){
  if(p.foto) return `<img src="${esc(p.foto)}" alt="${esc(p.nome)}" ${grande?"":'loading="lazy"'} data-dep="${p.dep}" onerror="imgFail(this)">`;
  if(p.ilu) return ILU(p.ilu)+`<span class="ilu-tag">Ilustração</span>`;
  if(p.icone) return `<svg viewBox="0 0 24 24" aria-hidden="true">${ITEM_ICON[p.icone]}</svg>`;
  return icon(p.dep);
}
const nomeCompleto = p => (/^Sementes de/.test(p.sub) || p.dep==="Sementes" ? "Semente " : "") + p.nome + (p.marca ? ` (${p.marca})` : "");
const comOpcao = p => nomeCompleto(p) + (p.opcoes ? ` – ${p.opNome||"opção"}: ${opAtual(p)}` : "");
function msgUnica(p){
  return p.restrito
    ? `Olá! Represento uma empresa de controle de pragas / órgão público e gostaria de consultar: ${nomeCompleto(p)} – ${p.un}.`
    : p.preco==null ? `Olá! Gostaria de consultar o preço de: ${comOpcao(p)} – ${p.un}.`
    : `Olá! Tenho interesse em: ${comOpcao(p)} – ${p.un} – ${brl(p.preco)}. Ainda tem disponível?`;
}
/* opções de tamanho/peso: a escolhida fica em SEL[id] */
const SEL = {};
const opAtual = p => p.opcoes ? (SEL[p.id] ?? p.opcoes[0]) : null;
const base = p => p.marca ? `${p.nome} · ${p.marca}` : p.nome;
const chave = (p, op=opAtual(p)) => op ? `${base(p)}||${op}` : base(p);
function chips(p){
  if(!p.opcoes) return "";
  const a = opAtual(p);
  if(p.opcoes.length>8){
    const noPed = p.opcoes.filter(o=>PEDIDO[chave(p,o)]);
    return `<label class="op-sel"><span>${esc(p.opNome||"Opção")}</span><select data-opsel="${p.id}">${p.opcoes.map(o=>`<option ${o===a?"selected":""} value="${esc(o)}">${esc(o)}${PEDIDO[chave(p,o)]?` (${PEDIDO[chave(p,o)]} no pedido)`:""}</option>`).join("")}</select></label>${noPed.length?`<span class="op-ped">No pedido: ${noPed.map(o=>`${esc(o)} (${PEDIDO[chave(p,o)]})`).join(", ")}</span>`:""}`;
  }
  return `<div class="opcoes" role="radiogroup" aria-label="${esc(p.opNome||"Opção")}">${p.opcoes.map(o=>
    `<button role="radio" aria-checked="${o===a}" class="${o===a?"on":""}" data-op="${p.id}" data-val="${esc(o)}">${esc(o)}${PEDIDO[chave(p,o)]?` <i>${PEDIDO[chave(p,o)]}</i>`:""}</button>`).join("")}</div>`;
}
function acoes(p){
  if(p.restrito) return `<a class="btn btn-wa" href="${waLink(msgUnica(p))}" target="_blank" rel="noopener">Consultar no WhatsApp</a>`;
  const q = PEDIDO[chave(p)]||0;
  const extra = p.opcoes ? ` (${esc(opAtual(p))})` : "";
  const corpo = !q ? `<button class="btn btn-add" data-add="${p.id}">+ Adicionar${p.opcoes?extra:" ao pedido"}</button>`
    : `<div class="qtd" role="group" aria-label="Quantidade de ${esc(p.nome)}${extra}">
    <button data-menos="${p.id}" aria-label="Diminuir">−</button><span aria-live="polite">${q}${p.porMetro?" m":""}${p.opcoes?`<small>${esc(opAtual(p))}</small>`:""}</span><button data-mais="${p.id}" aria-label="Aumentar">+</button></div>`;
  return chips(p) + corpo;
}
function selo(p){
  return p.restrito ? '<span class="badge b-restrito">Venda restrita</span>'
    : p.preco==null ? '<span class="badge b-consulta">Sob consulta</span>'
    : p.antigo ? `<span class="badge b-promo">-${Math.round((1-p.preco/p.antigo)*100)}%</span>`
    : p.novo ? '<span class="badge b-novo">Novidade</span>' : '';
}
const precoHTML = p => p.preco==null ? '<span class="ask">Consultar preço</span>'
    : `${p.antigo?`<s>${brl(p.antigo)}</s>`:''}<strong>${brl(p.preco)}</strong>${p.porMetro?' <span class="unit">/ metro</span>':""}`;
const fundo = p => p.foto||p.ilu ? " has-photo" : "";
function card(p){
  return `<article class="card">
    <button class="thumb${fundo(p)}" data-ver="${p.id}" style="background:${TINT[p.dep]};color:${INK[p.dep]}" aria-label="Ver detalhes de ${esc(p.nome)}">${selo(p)}${midia(p)}</button>
    <div class="card-body">
      <span class="cat">${p.marca ? `<b>${esc(p.marca)}</b> · ` : ""}${esc(p.sub)}</span>
      <h3><button class="ver-tit" data-ver="${p.id}">${esc(p.nome)}</button></h3>
      <span class="unit">${esc(p.un)}${p.opcoes?` · ${p.opcoes.length} opções`:""}</span>${p.restrito?`<span class="restr">Venda restrita a empresas de controle de pragas e órgãos públicos, com autorização de engenheiro agrônomo.</span>`:""}
      <div class="price">${precoHTML(p)}</div>
      <div class="acoes" data-acoes="${p.id}">${acoes(p)}</div>
    </div></article>`;
}

/* ===== PEDIDO (vários itens numa mensagem só) ===== */
let PEDIDO = {};
try{ PEDIDO = JSON.parse(localStorage.getItem("defema-pedido")||"{}") || {}; }catch(_){ PEDIDO = {}; }
const doPedido = k => { const [n,op] = k.split("||"); const p = PRODUTOS.find(x=>base(x)===n); return p && (!op || (p.opcoes||[]).includes(op)) ? {p, op:op||null, k, q:PEDIDO[k]} : null; };
Object.keys(PEDIDO).forEach(k=>{ if(!doPedido(k)) delete PEDIDO[k]; });
const itensPedido = () => Object.keys(PEDIDO).map(doPedido).filter(x=>x&&x.q>0);
function salvarPedido(){ try{ localStorage.setItem("defema-pedido", JSON.stringify(PEDIDO)); }catch(_){} }
function mudarQtd(p, delta, k=chave(p)){
  const q = Math.max(0,(PEDIDO[k]||0)+delta);
  if(q) PEDIDO[k]=q; else delete PEDIDO[k];
  salvarPedido(); atualizarPedido(p);
}
function totais(){
  const it = itensPedido();
  const qtd = it.reduce((a,x)=>a+(x.p.porMetro?1:x.q),0);
  const total = it.filter(x=>x.p.preco!=null).reduce((a,x)=>a+x.p.preco*x.q,0);
  const consultar = it.some(x=>x.p.preco==null);
  return {it,qtd,total,consultar};
}
function atualizarPedido(p){
  if(p) document.querySelectorAll(`[data-acoes="${p.id}"]`).forEach(el=>el.innerHTML=acoes(p));
  const {qtd,total,consultar} = totais();
  const bar = document.getElementById("pedidoBar");
  bar.hidden = !qtd;
  document.body.classList.toggle("tem-pedido", !!qtd);
  bar.querySelector("[data-resumo]").innerHTML = `<b>${qtd} ${qtd===1?"item":"itens"}</b> · ${total?brl(total):""}${consultar?(total?" + ":"")+"a consultar":""}`;
  if(document.getElementById("dlgPedido").open) desenharPedido();
}
function desenharPedido(){
  const {it,total,consultar} = totais();
  const box = document.getElementById("pedidoConteudo");
  if(!it.length){ box.innerHTML = `<p class="vazio">Seu pedido está vazio. Toque em <b>+ Adicionar ao pedido</b> nos produtos.</p>`; return; }
  box.innerHTML = `<ul class="itens">${it.map(({p,op,k,q})=>`<li>
      <div class="mini${fundo(p)}" style="background:${TINT[p.dep]};color:${INK[p.dep]}">${midia(p)}</div>
      <div class="info"><b>${esc(p.nome)}${op?` · ${esc(op)}`:""}</b><span>${esc(p.un)}</span>
        <span class="vl">${p.preco==null?"Consultar preço":brl(p.preco*q)}</span></div>
      <div class="qtd mini-q"><button data-menos="${p.id}" data-k="${esc(k)}" aria-label="Diminuir">−</button><span>${q}${p.porMetro?" m":""}</span><button data-mais="${p.id}" data-k="${esc(k)}" aria-label="Aumentar">+</button></div>
    </li>`).join("")}</ul>
    ${total?`<div class="total"><span>Total${consultar?" dos itens com preço":""}</span><strong>${brl(total)}</strong></div>`:`<div class="total"><span>Total</span><strong class="ask">A consultar</strong></div>`}
    ${consultar?`<p class="obs">Os itens “consultar preço” a loja confirma pelo WhatsApp.</p>`:""}
    <label class="campo">Seu nome <input id="pedNome" type="text" autocomplete="name" placeholder="Opcional"></label>
    <a class="btn btn-wa grande" id="pedEnviar" target="_blank" rel="noopener">Enviar pedido pelo WhatsApp</a>
    <button class="link limpar" data-limpar>Limpar pedido</button>`;
  const enviar = ()=>{
    const nome = (document.getElementById("pedNome")||{}).value||"";
    const linhas = it.map(({p,op,q})=>`• ${q}${p.porMetro?" m de":"x"} ${nomeCompleto(p)}${op?` – ${p.opNome||"opção"}: ${op}`:""} – ${p.un} – ${p.preco==null?"consultar preço":brl(p.preco*q)}`);
    const msg = `Olá! Gostaria de fazer este pedido pelo site:\n\n${linhas.join("\n")}\n\n*${total?`Total${consultar?" (itens com preço)":""}: ${brl(total)}`:"Valores: aguardo a confirmação da loja"}*${nome.trim()?`\nNome: ${nome.trim()}`:""}\nVou retirar na loja. Pode separar?`;
    document.getElementById("pedEnviar").href = waLink(msg);
  };
  enviar();
  document.getElementById("pedNome").addEventListener("input", enviar);
}
function abrirDetalhe(p){
  const d = document.getElementById("dlgProduto");
  d.querySelector("[data-det]").innerHTML = `
    <div class="det-media${fundo(p)}" style="background:${TINT[p.dep]};color:${INK[p.dep]}">${selo(p)}${midia(p,true)}</div>
    <div class="det-info">
      <span class="cat">${p.marca ? `<b>${esc(p.marca)}</b> · ` : ""}${esc(p.dep)} › ${esc(p.sub)}</span>
      <h2 id="detTitulo">${esc(p.nome)}</h2>
      <span class="unit">${esc(p.un)}</span>
      <div class="price">${precoHTML(p)}</div>
      <p>${esc(descricao(p))}</p>
      ${p.restrito?`<span class="restr">Venda restrita a empresas de controle de pragas e órgãos públicos, com autorização de engenheiro agrônomo.</span>`:""}
      ${p.dep==="Defensivos"&&!p.restrito?`<p class="obs">Leia e siga sempre as instruções do rótulo.</p>`:""}
      <div class="acoes" data-acoes="${p.id}">${acoes(p)}</div>
      ${p.restrito?"":`<a class="link so-este" href="${waLink(msgUnica(p))}" target="_blank" rel="noopener">ou perguntar só sobre este produto no WhatsApp →</a>`}
    </div>`;
  if(!d.open) d.showModal();
}
function imgFail(img){
  const t = img.parentElement; t.classList.remove("has-photo");
  img.insertAdjacentHTML("afterend", icon(img.dataset.dep)); img.remove();
}
const grid = list => list.length ? `<div class="grid">${list.map(card).join("")}</div>`
  : `<div class="empty">Nenhum produto encontrado. Chame a gente no WhatsApp que verificamos no estoque.</div>`;

function viewInicio(){

  return `
  <section class="block">
    <div class="sec-head"><h2>Promoções da semana</h2><span class="crumb">${promos.length} itens com desconto</span></div>

  <section class="block">
    <div class="sec-head"><h2>Mais procurados</h2><button class="link" data-go="produtos">Ver catálogo completo →</button></div>
    ${grid(top)}
  </section>`;
}

/* ===== BUSCA TOLERANTE A ERROS =====
   Ignora acentos, maiúsculas e erros comuns de português (ç/ss/s/z, ch/x, g/j, qu/k, h mudo, l/u no fim...)
   e aceita pequenos erros de digitação (letra trocada, faltando ou sobrando). */
const SINONIMOS = {
  veneno:"defensivos inseticida carrapaticida", remedio:"inseticida carrapaticida", bicho:"inseticida",
  bomba:"pulverizador", pulverisador:"pulverizador", maquina:"maquinas", mato:"rocadeira aparador",
  grama:"aparador rocadeira", capim:"rocadeira aparador", rocadeira:"rocadeira aparador",
  carrapato:"carrapaticida", mosca:"mosquicida", mosquito:"mosquicida mosquitos", gado:"bovinos carrapaticida", boi:"bovinos carrapaticida", vaca:"bovinos carrapaticida",
  escorpiao:"escorpioes", dedetizacao:"uso profissional ficam", dedetizadora:"uso profissional ficam",
  esterco:"humus adubo", cal:"calcario", adubo:"adubo npk", terra:"terra substrato humus",
  semente:"sementes", paceta:"marreta", marreta:"marreta", muda:"mudas", foice:"ferramentas"
};
const PARADAS = new Set(["de","da","do","das","dos","pra","para","pro","com","e","a","o","as","os","um","uma","no","na"]);
const semAcento = t => t.toLowerCase().replace(/(\d)\s*[x×]\s*(\d)/g,"$1x$2").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g," ");
function fonetico(w){
  return w
    .replace(/ph/g,"f").replace(/lh/g,"li").replace(/nh/g,"ni").replace(/(ch|sh)/g,"x")
    .replace(/qu(?=[ei])/g,"k").replace(/qu/g,"ku").replace(/c(?=[ei])/g,"s").replace(/c/g,"k")
    .replace(/gu(?=[ei])/g,"g").replace(/g(?=[ei])/g,"j").replace(/ç/g,"s").replace(/(sc|xc|ss)(?=[ei])/g,"s").replace(/z/g,"s")
    .replace(/y/g,"i").replace(/w/g,"v").replace(/h/g,"")
    .replace(/l$/,"u").replace(/m$/,"n")
    .replace(/(.)\1+/g,"$1");
}
const palavras = t => semAcento(t).split(/\s+/).filter(w=>w && !PARADAS.has(w));
function lev(a,b){
  if(Math.abs(a.length-b.length)>2) return 9;
  let prev = Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){
    const cur=[i];
    for(let j=1;j<=b.length;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
      if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) cur[j]=Math.min(cur[j],prev[j-2]+1); // letras invertidas
    }
    prev=cur;
  }
  return prev[b.length];
}
const tolerancia = n => n<=3 ? 0 : n<=7 ? 1 : 2;
/* nota de 0 a 1 de quanto a palavra digitada combina com uma palavra do produto */
function nota(q, w){
  if(w===q) return 1;
  if(w.startsWith(q)) return q.length>=2 ? .9 : 0;          // digitando pela metade
  if(q.length>=4 && w.includes(q)) return .75;
  const t = tolerancia(q.length);
  if(!t || q[0]!==w[0]) return 0;                           // erro de digitação raramente é na 1ª letra
  if(lev(q,w)<=t) return .7;                                // palavra inteira com erro
  if(q.length>=5 && w.length>q.length && lev(q,w.slice(0,q.length))<=t) return .6; // pedaço com erro
  return 0;
}
const INDICE = new Map();
function indice(p){
  if(!INDICE.has(p)){
    const ws = palavras([p.nome,p.marca||"",p.sub,p.dep,p.un,...(p.opcoes||[])].join(" "));
    ws.push(semAcento(p.nome).replace(/\s+/g,""));          // "kothrine" acha "K-Othrine"
    INDICE.set(p,[...new Set(ws.flatMap(w=>[w,fonetico(w)]))]);
  }
  return INDICE.get(p);
}
const FRASES = [[/bomba (de |pra |para )?(veneno|passar veneno)|maquina (de |pra )?veneno|passar veneno/g,"pulverizador"],[/cortar (grama|mato)/g,"rocadeira"]];
function buscar(texto, lista){
  let t = semAcento(texto); FRASES.forEach(([re,sub])=>t=t.replace(re,sub));
  const termos = palavras(t).map(w=>{
    const alt = new Set([w,fonetico(w)]);
    const sin = SINONIMOS[w] || SINONIMOS[fonetico(w)] || Object.entries(SINONIMOS).find(([k])=>w.length>=5&&k[0]===w[0]&&lev(w,k)<=tolerancia(w.length))?.[1];
    if(sin) sin.split(" ").forEach(x=>{alt.add(x);alt.add(fonetico(x));});
    return [...alt];
  });
  if(!termos.length) return {list:lista, parecidos:false};
  const pont = lista.map(p=>{
    const ws = indice(p);
    const notas = termos.map(alts=>Math.max(0,...alts.flatMap(a=>ws.map(w=>nota(a,w)))));
    return {p, achou:notas.filter(n=>n>0).length, total:notas.reduce((a,b)=>a+b,0)};
  });
  const todos = pont.filter(x=>x.achou===termos.length);
  const algum = todos.length ? todos : pont.filter(x=>x.achou>0);
  algum.sort((a,b)=>b.total-a.total);
  const melhor = algum.length ? algum[0].total : 0;
  return {list:algum.filter(x=>x.total>=melhor*.75).map(x=>x.p), parecidos:!todos.length && algum.length>0};
}

function viewProdutos(){
  let list = PRODUTOS;
  if(state.dep) list = list.filter(p=>p.dep===state.dep);
  if(state.sub) list = list.filter(p=>p.sub===state.sub);
  const q = state.q.trim();
  let parecidos = false;
  if(q){ const r = buscar(q, list); list = r.list; parecidos = r.parecidos; }
  const title = q ? (parecidos ? `Resultados parecidos com “${esc(q)}”` : `Resultados para “${esc(q)}”`) : state.sub || state.dep || "Todos os produtos";
  const aviso = state.dep==="Defensivos"
    ? `<div class="notice"><b>Venda livre no balcão, exceto os de uso profissional</b>Os produtos marcados como <b style="display:inline">Venda restrita</b> são vendidos somente a empresas de controle de pragas (dedetizadoras) e órgãos públicos, com autorização de engenheiro agrônomo. Consulte preço e disponibilidade pelo WhatsApp e leia sempre o rótulo.</div>` : "";
  return `<div class="crumb">Início › Produtos${state.dep?" › "+state.dep:""}${state.sub?" › "+state.sub:""}</div>
    <div class="sec-head"><h2>${title}</h2><span class="crumb">${list.length} produto${list.length===1?"":"s"}</span></div>
    ${aviso}${grid(list)}`;
}

function renderAtalhos(){
  document.getElementById("shortcuts").innerHTML = Object.keys(DEPS).map(d=>`<button class="shortcut" data-dep="${d}">
      <span class="ic" style="background:${TINT[d]};color:${INK[d]}">${icon(d)}</span>
      <b>${d}</b><span>${DEP_INFO[d]}</span></button>`).join("");
}
function render(){
  document.body.classList.toggle("pg-inicio", state.page==="inicio");
  document.body.classList.toggle("pg-sobre", state.page==="sobre");
  document.querySelectorAll(".shortcut").forEach(b=>b.classList.toggle("on", state.page==="produtos" && b.dataset.dep===state.dep));
  document.getElementById("view").innerHTML = {inicio:viewInicio, produtos:viewProdutos, sobre:viewSobre}[state.page]();
  document.querySelectorAll("nav.main a").forEach(a=>{ a.dataset.go===state.page ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"); });
  renderDeps();
}
function go(page, opts={}){
  state = {...state, page, ...opts};
  if(page!=="produtos"){state.dep=null;state.sub=null;}
  render();
  window.scrollTo({top:0});
}

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-op],[data-add],[data-mais],[data-menos],[data-ver],[data-abrir-pedido],[data-limpar],[data-fechar]");
  if(t){
    const ds=t.dataset;
    if(ds.op!=null){ const p=PRODUTOS[ds.op]; SEL[p.id]=ds.val; atualizarPedido(p); const d=document.getElementById("dlgProduto"); if(d.open && d.querySelector(`[data-acoes="${p.id}"]`)) abrirDetalhe(p); return; }
    if(ds.add!=null) return mudarQtd(PRODUTOS[ds.add],1);
    if(ds.mais!=null) return mudarQtd(PRODUTOS[ds.mais],1,ds.k||undefined);
    if(ds.menos!=null) return mudarQtd(PRODUTOS[ds.menos],-1,ds.k||undefined);
    if(ds.ver!=null) return abrirDetalhe(PRODUTOS[ds.ver]);
    if(ds.abrirPedido!=null){ document.getElementById("dlgProduto").close(); desenharPedido(); return document.getElementById("dlgPedido").showModal(); }
    if(ds.limpar!=null){ PEDIDO={}; salvarPedido(); document.querySelectorAll("[data-acoes]").forEach(el=>el.innerHTML=acoes(PRODUTOS[el.dataset.acoes])); return atualizarPedido(); }
    if(ds.fechar!=null) return t.closest("dialog").close();
  }
  const g = e.target.closest("[data-go]");
  if(g){ e.preventDefault(); state.q=""; document.getElementById("q").value=""; go(g.dataset.go,{dep:null,sub:null}); return; }
  const d = e.target.closest("button[data-dep]");
  if(d){ document.getElementById("q").value=""; go("produtos",{dep:d.dataset.dep, sub:d.dataset.sub||null, q:""});
    if(innerWidth<=860){document.getElementById("deps").classList.remove("open");document.getElementById("depToggle").setAttribute("aria-expanded","false");} }
});
document.addEventListener("change", e=>{
  const sel = e.target.closest("[data-opsel]"); if(!sel) return;
  const p = PRODUTOS[sel.dataset.opsel]; SEL[p.id]=sel.value; atualizarPedido(p);
  const d=document.getElementById("dlgProduto"); if(d.open && d.querySelector(`[data-acoes="${p.id}"]`)) abrirDetalhe(p);
});
document.getElementById("searchForm").addEventListener("submit", e=>e.preventDefault());
document.getElementById("q").addEventListener("input", e=>go("produtos",{q:e.target.value, dep:null, sub:null}));

document.getElementById("depToggle").addEventListener("click", e=>{

const h = location.hash.replace("#","");
if(["inicio","produtos","sobre"].includes(h)) state.page = h;
/* departamento novo criado no painel: usa ícone e cores padrão */
function coresPadrao(){
  Object.keys(DEPS).forEach(d=>{ ICON[d] ??= ICON["Ferramentas"]; TINT[d] ??= "#eef0ec"; INK[d] ??= "#1f4d2d"; });
}
/* chega catálogo novo do Supabase: troca e redesenha a tela atual */
function atualizarCatalogo(d){
  if(!trocarCatalogo(d)) return;
  coresPadrao();
  for(const k in SEL) delete SEL[k];
  const dlg = document.getElementById("dlgProduto"); if(dlg.open) dlg.close();
  if(state.dep && !DEPS[state.dep]) { state.dep = null; state.sub = null; }
  renderAtalhos(); atualizarPedido(); render();
}
coresPadrao();
renderAtalhos();
render();
if(TEM_SUPABASE) carregarCatalogo({ ...SUPABASE, fallback: EMBUTIDO, onAtualizar: atualizarCatalogo })
  .then(atualizarCatalogo);
